# Anonymous login and registration starts each create a database row, so both are rate limited per
# client address, sharing one budget (they write through the same backend code path).
limit_req_zone $binary_remote_addr zone=login_start:10m rate=10r/m;
# Each request here sends a real SMS (real money per message), so this is stricter than login_start;
# the per-user 60s cooldown in the API limits a single account, this limits a single client address
# across accounts. Verify has no per-message cost — its 5-attempt-per-code lockout already limits
# guessing — but it gets the same treatment cheaply since the location block is nearly identical.
limit_req_zone $binary_remote_addr zone=phone_code:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=phone_verify:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=login_start burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/profile/phone {
        limit_req zone=phone_code burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/profile/phone/verify {
        limit_req zone=phone_verify burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Up to 5 attachments of 20 MB each plus form fields; the API enforces the exact per-file limits.
        client_max_body_size 105m;
        error_page 413 = @too_large;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # nginx is the edge: overwrite instead of appending so clients cannot inject addresses into audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Слишком большой объём данных","details":null}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"Слишком много запросов, повторите позже","details":null}';
    }

    location /auth/ {
        # Resolve Keycloak lazily so nginx still starts (and serves the app) while Keycloak is booting.
        resolver 127.0.0.11 valid=30s;
        set $keycloak_upstream http://keycloak:8080;
        proxy_pass $keycloak_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Keycloak login responses carry large cookies and headers.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / { try_files $uri $uri/ /index.html; }
}
