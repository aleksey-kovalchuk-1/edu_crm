server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # nginx is the edge: overwrite instead of appending so clients cannot inject addresses into audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        # Resolve Keycloak lazily so nginx still starts (and serves the app) while Keycloak is booting.
        resolver 127.0.0.11 valid=30s;
        set $keycloak_upstream http://keycloak:8080;
        proxy_pass $keycloak_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Keycloak login responses carry large cookies and headers.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / { try_files $uri $uri/ /index.html; }
}
