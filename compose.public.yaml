# Public/demo overlay for the Cloudflare Tunnel deployment. Use together with the base file:
#   docker compose -f compose.yaml -f compose.public.yaml up -d
# Never used alone — it only overrides the handful of values that must reflect the public origin.
# See docs/superpowers/specs/2026-09-20-laptop-cloudflare-tunnel-design.md.
services:
  api:
    environment:
      SEED_DEMO: 'false'
      PUBLIC_BASE_URL: https://unicrm.tech
      OIDC_ISSUER: https://unicrm.tech/auth/realms/edu-crm
      COOKIE_SECURE: 'true'
      BACKUP_STATUS_FILE: /run/edu-crm-backup-status/status.json
      # Manual backup: the API may only drop a request flag here; the host agent
      # (deploy/launchd/tech.unicrm.backup-request.plist) runs the real backup script.
      BACKUP_REQUEST_DIR: /run/edu-crm-backup-requests
    volumes:
      - ${BACKUP_STATUS_DIR:-./deploy/local/backup-status}:/run/edu-crm-backup-status:ro
      - ${BACKUP_REQUEST_DIR:-./deploy/local/backup-requests}:/run/edu-crm-backup-requests

  notifier:
    environment:
      SEED_DEMO: 'false'
      PUBLIC_BASE_URL: https://unicrm.tech
      OIDC_ISSUER: https://unicrm.tech/auth/realms/edu-crm
      COOKIE_SECURE: 'true'

  keycloak:
    environment:
      KC_HOSTNAME: https://unicrm.tech/auth

  web:
    build:
      args:
        VITE_DEMO_MODE: 'false'
    volumes:
      - ./frontend/nginx.public.conf:/etc/nginx/conf.d/default.conf:ro
