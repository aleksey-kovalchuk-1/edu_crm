# Sent when the superadmin grants access to someone who hasn't confirmed their address or set a password (D-241).
# {0} link, {1} link lifetime in minutes, {2} realm name, {3} required actions, {4} link lifetime in words.
executeActionsSubject=UniCRM: доступ выдан — задайте пароль
executeActionsBody=Администратор выдал вам доступ к UniCRM.\n\nЧтобы войти, подтвердите адрес электронной почты и задайте пароль по ссылке:\n\n{0}\n\nСсылка действует {4}. После этого откройте UniCRM и войдите со своим логином и новым паролем.\n\nЕсли вы не регистрировались в UniCRM, просто не отвечайте на это письмо.
executeActionsBodyHtml=<p>Администратор выдал вам доступ к UniCRM.</p><p>Чтобы войти, подтвердите адрес электронной почты и задайте пароль:</p><p><a href="{0}">Подтвердить адрес и задать пароль</a></p><p>Ссылка действует {4}. После этого откройте UniCRM и войдите со своим логином и новым паролем.</p><p>Если вы не регистрировались в UniCRM, просто не отвечайте на это письмо.</p>
