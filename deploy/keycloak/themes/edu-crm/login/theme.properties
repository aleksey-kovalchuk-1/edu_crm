# UniCRM sign-in and registration pages (spec 2026-09-28-rostelecom-redesign-design.md §7). Everything not
# listed here comes from Keycloak's own keycloak.v2 theme. The folder is named edu-crm because the production
# realm already selects that theme (loginTheme=edu-crm), so mounting it is enough.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/unicrm.css
scripts=js/captcha-fit-2.js
locales=ru
# The Rostelecom tokens are light only.
darkMode=false
