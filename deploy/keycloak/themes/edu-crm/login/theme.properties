# Override of the built-in theme (see docs/decisions.md D-156, amended by D-158 for the
# registration page sizing below); everything not listed here comes from the parent theme.
parent=keycloak.v2
import=common/keycloak

# register.ftl: same as keycloak.v2's own, except the reCAPTCHA widget uses data-size="normal"
# instead of "compact" (D-158).
#
# styles: keycloak.v2's own css/styles.css is not overridden here (this theme has no
# resources/css/styles.css of its own, so that entry resolves to the parent's file), plus one
# additional stylesheet widening the registration card and centering/spacing the larger reCAPTCHA.
styles=css/styles.css css/edu-crm-registration.css
