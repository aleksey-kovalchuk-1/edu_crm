services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm -d edu_crm']
      interval: 5s
      timeout: 3s
      retries: 15

  # One-shot job: creates Keycloak's role and database on the shared server (idempotent).
  keycloak-db-init:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - path: deploy/local/keycloak.env
        required: true
    environment:
      PGHOST: db
      PGUSER: crm
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      PGDATABASE: postgres
    volumes:
      - ./deploy/keycloak/init-db.sh:/init-db.sh:ro
    entrypoint: [sh, /init-db.sh]
    depends_on:
      db:
        condition: service_healthy

  # SMTP catcher for local dev/CI: Keycloak's default mail server (realm-edu-crm.json smtpServer,
  # ${SMTP_HOST:mailpit} etc.), so registration email verification and password reset work with zero
  # secrets out of the box. Override with a real mailbox through deploy/local/keycloak.env (D-159).
  mailpit:
    image: axllent/mailpit:v1.20.3
    restart: unless-stopped
    ports:
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8025/api/v1/info]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [start, --import-realm]
    restart: unless-stopped
    env_file:
      - path: deploy/local/keycloak.env
        required: true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      # Published by nginx under /auth on the main port, so the token issuer stays http://localhost:8080/auth/realms/edu-crm.
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./deploy/keycloak/realm-edu-crm.json:/opt/keycloak/data/import/realm-edu-crm.json:ro
      - ./deploy/keycloak/themes/edu-crm:/opt/keycloak/themes/edu-crm:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      # The image has bash but no curl or wget; the management interface listens on port 9000.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # One-shot job: sets the reCAPTCHA site/secret key on the registration flow's reCAPTCHA execution
  # (idempotent, see deploy/keycloak/configure-recaptcha.py and D-158; realm-import cannot set a
  # per-execution authenticatorConfig reliably in this Keycloak version).
  keycloak-recaptcha-init:
    image: python:3.12-alpine
    restart: "no"
    env_file:
      - path: deploy/local/keycloak.env
        required: true
    environment:
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/auth
    volumes:
      - ./deploy/keycloak/configure-recaptcha.py:/configure-recaptcha.py:ro
    entrypoint: [python3, /configure-recaptcha.py]
    depends_on:
      keycloak:
        condition: service_healthy

  # One-shot job: adds crm-user to the realm default role's composites (idempotent, see
  # deploy/keycloak/configure-default-role.py and D-157; realm-import silently ignores a
  # composites list on a roles[] entry that names the already-autocreated default role).
  keycloak-default-role-init:
    image: python:3.12-alpine
    restart: "no"
    env_file:
      - path: deploy/local/keycloak.env
        required: true
    environment:
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/auth
    volumes:
      - ./deploy/keycloak/configure-default-role.py:/configure-default-role.py:ro
    entrypoint: [python3, /configure-default-role.py]
    depends_on:
      keycloak:
        condition: service_healthy

  # Malware scanning for document uploads (D-165, owner-approved). No published port: only the worker
  # talks to it, over the Compose network. freshclam downloads virus definitions on first boot, which
  # needs internet access and can take a few minutes -- CI does not run this service (backend tests use a
  # fake clamd double); it is only part of the local/dev Compose stack.
  clamav:
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: [CMD, /usr/local/bin/clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: deploy/local/api.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/edu_crm
      SEED_DEMO: ${SEED_DEMO:-true}
      OIDC_ISSUER: http://localhost:8080/auth/realms/edu-crm
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080/auth/realms/edu-crm
      OIDC_CLIENT_ID: edu-crm-api
      PUBLIC_BASE_URL: http://localhost:8080
      # Local HTTP only; set to true behind HTTPS.
      COOKIE_SECURE: 'false'
      # uvicorn reads both: worker processes, and which proxies may set X-Forwarded-* (only nginx reaches the API on the Compose network).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      FORWARDED_ALLOW_IPS: '*'
      ATTACHMENTS_DIR: /data/attachments
      DOCUMENTS_DIR: /data/documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    volumes:
      # Files attached to status changes; include this volume in backups together with the database.
      - attachments_data:/data/attachments
      # Uploaded documents (quarantine + validated library, T-093); back up alongside the database.
      - documents_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  # Background job runner (D-166): same image and settings as api, different entrypoint. Picks up import
  # apply/rollback (T-091/T-092) and document scanning (T-093) from `background_jobs`.
  worker:
    build: ./backend
    command: [python, -m, app.worker]
    restart: unless-stopped
    env_file:
      - path: deploy/local/api.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/edu_crm
      OIDC_ISSUER: http://localhost:8080/auth/realms/edu-crm
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080/auth/realms/edu-crm
      OIDC_CLIENT_ID: edu-crm-api
      PUBLIC_BASE_URL: http://localhost:8080
      COOKIE_SECURE: 'false'
      ATTACHMENTS_DIR: /data/attachments
      DOCUMENTS_DIR: /data/documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      # api already migrated by the time it's healthy; avoids a concurrent, unlocked migration race.
      SKIP_MIGRATE: 'true'
    volumes:
      - attachments_data:/data/attachments
      - documents_data:/data/documents
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
      # Without these, web (and registration through it) is reachable before the CAPTCHA secret and the
      # crm-user default-role grant are actually in place on a fresh boot.
      keycloak-recaptcha-init:
        condition: service_completed_successfully
      keycloak-default-role-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8080:80
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/ > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  superset:
    profiles: [analytics]
    build: ./superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    volumes:
      - superset_data:/app/superset_home
    ports:
      - 127.0.0.1:8088:8088
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
  documents_data:
  clamav_data:
  superset_data:
