services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm -d edu_crm']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/edu_crm
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:80
  superset:
    profiles: [analytics]
    build: ./superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    volumes:
      - superset_data:/app/superset_home
    ports:
      - 127.0.0.1:8088:8088
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  superset_data:
